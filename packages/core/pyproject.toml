[project]
name = "evidex-core"
version = "0.1.0"
description = "Content hashing and typed, tenant-rooted identifiers."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# `evidex` is a PEP 420 namespace package shared by every workspace member, so the
# wheel must contain the `evidex/` directory without an `__init__.py` of its own.
[tool.hatch.build.targets.wheel]
packages = ["src/evidex"]
