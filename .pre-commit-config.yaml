# Local hooks only: every tool runs through uv, so its version comes from uv.lock and
# nothing else is downloaded. Install with `uvx pre-commit install`.
minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format --check
        entry: uv run --locked ruff format --check
        language: system
        types: [python]

      - id: uv-lock
        name: uv lock --check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock|packages/[^/]+/pyproject\.toml)$
        pass_filenames: false

      # Slower checks run before a push instead of before every commit.
      - id: mypy
        name: mypy --strict
        entry: uv run --locked mypy packages/core/src packages/core/tests
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pytest
        name: pytest
        entry: uv run --locked pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
